# ============================================================================
# Chimera-RAG 默认配置模板
# ----------------------------------------------------------------------------
# 本文件是所有字段的参考说明，实际运行时请选择或派生出 vanilla / adagraph_only
# / intent_agent_only / full 中的某一份。
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  # 所有运行产物（索引、图谱持久化、日志）写入的工作区目录
  workspace_dir: ./storage/default

logging:
  level: INFO              # DEBUG / INFO / WARNING / ERROR
  format: rich             # rich / plain / json
  file: null               # null 表示只打到 stdout；否则为日志文件路径

# ---------------------------------------------------------------------------
# LLM / Embedding
# ---------------------------------------------------------------------------
llm:
  provider: mock           # mock / openai / deepseek / ollama
  # model / api_key / base_url 可直接从 .env 读取（LLM_MODEL / LLM_API_KEY / LLM_BASE_URL）；
  # 也保留旧的 api_key_env / base_url_env 字段做向后兼容。
  model: mock-llm
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  temperature: 0.1
  max_tokens: 1024
  timeout: 30
  retry:
    max_attempts: 3
    initial_wait: 1.0
    max_wait: 10.0

embedding:
  provider: mock           # mock / openai / ollama / sentence_transformer
  model: mock-embedding
  dim: 64                  # sentence_transformer 会在加载时和模型维度核对
  batch_size: 32
  normalize: true
  device: cpu              # cpu / cuda / mps / auto（仅 sentence_transformer 生效）

# ---------------------------------------------------------------------------
# 存储层
# ---------------------------------------------------------------------------
storage:
  graph:
    backend: networkx      # networkx / neo4j
    persist_path: ./storage/default/graph.gpickle
    # 仅 neo4j 后端使用：
    neo4j_uri: bolt://localhost:7687
    neo4j_user: neo4j
    neo4j_password_env: NEO4J_PASSWORD
  vector:
    backend: faiss
    index_type: hnsw       # flat_ip / flat_l2 / ivf_flat / hnsw（默认）
    metric: ip             # ip / l2（仅对 hnsw/ivf 有意义；flat_* 由索引名决定）
    persist_path: ./storage/default/vectors
    top_k: 5
    hnsw:
      M: 32                # 节点最大连接度
      ef_construction: 200 # 构建期搜索宽度
      ef_search: 64        # 查询期搜索宽度（可在线 set_ef_search 调整）
    ivf:
      nlist: 100           # 粗聚类桶数（至少有 nlist 个向量才能训练）
      nprobe: 8            # 每次查询探测的桶数

# ---------------------------------------------------------------------------
# 数据集（命名注册；由 main.py --dataset <name> 选用）
# 优先使用 corpus_path / qa_path / output_dir；legacy path 仍兼容。
# ---------------------------------------------------------------------------
datasets:
  sample:
    loader: plain_text
    path: ./examples/data/sample.txt
  hotpotqa:
    loader: hotpotqa
    corpus_path: ./data/hotpotqa/hotpotqa_corpus.json
    qa_path:     ./data/hotpotqa/hotpotqa.json
    output_dir:  ./output/hotpotqa
    split: dev
    eval_field_mapping:
      question: question
      answer: answer
      contexts: context
  two_wiki:
    loader: two_wiki
    path: ./data/two_wiki/dev.json
    output_dir: ./output/two_wiki
  musique:
    loader: musique
    path: ./data/musique/musique_ans_v1.0_dev.jsonl
    output_dir: ./output/musique
  mock_wiki:
    loader: mock_wiki
    corpus_path: ./data/mock_wiki/corpus.txt
    qa_path:     ./data/mock_wiki/qa.jsonl
    output_dir:  ./output/mock_wiki
  custom_jsonl:
    loader: generic_jsonl
    path: ./data/custom.jsonl
    output_dir: ./output/custom
    eval_field_mapping:
      question: question
      answer: answer

# ---------------------------------------------------------------------------
# 摄取阶段（构建知识图谱）
# ---------------------------------------------------------------------------
ingestion:
  chunker:
    active: defaults.fixed            # defaults.fixed / adagraph.dynamic
    params:
      chunk_size: 300
      overlap: 50
  extractor:
    active: defaults.simple_llm       # defaults.simple_llm / adagraph.layered
    params:
      prompt_template: default
      max_triples_per_chunk: 30
  pruner:
    active: defaults.noop             # defaults.noop / adagraph.dual_redundancy
    params: {}

# ---------------------------------------------------------------------------
# 查询阶段
# ---------------------------------------------------------------------------
query:
  intent_classifier:
    active: defaults.rule             # defaults.rule / intent_agent.llm
    params: {}
  retriever:
    active: defaults.direct           # defaults.direct / intent_agent.strategy_selector
    params:
      top_k: 5
      neighbor_hops: 1
  generator:
    active: defaults.prompt
    params:
      prompt_template: default

# ---------------------------------------------------------------------------
# 插件开关与子配置
# ---------------------------------------------------------------------------
plugins:
  adagraph:
    enabled: false
    dynamic_chunker:
      min_chunk_size: 100
      max_chunk_size: 500
      base_chunk_size: 300
      complexity_weight: 0.5
      density_weight: 0.5
    layered_extractor:
      layers_enabled: [L1]   # L1 / L2 / L3 / L4
    dual_pruner:
      similarity_threshold: 0.85
      enable_transitive: false

  intent_agent:
    enabled: false
    memory:
      backend: in_memory     # in_memory / redis (未实装)
      max_history: 10
    intent_classifier:
      provider: llm           # llm / rule
      confidence_threshold: 0.6
    strategies:
      enabled: [direct, multi_hop, comparative, iterative, expansion, context_aware]
    hooks:
      reflection:
        enabled: false
        quality_threshold: 0.7
        max_iterations: 3
      reranking:
        enabled: false
        model: cross-encoder/ms-marco-MiniLM-L-6-v2
        top_n: 10
      parallel_pool:
        enabled: false
        max_workers: 4

# ---------------------------------------------------------------------------
# Web 服务
# ---------------------------------------------------------------------------
web:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173
  static_dir: src/chimera_rag/web/static

# ---------------------------------------------------------------------------
# 评测
# ---------------------------------------------------------------------------
evaluation:
  metrics: [em, f1]          # em / f1 / rouge_l / bertscore
  max_samples: 100
  parallel: 1
  bertscore_lang: en
