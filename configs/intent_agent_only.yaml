# ============================================================================
# IntentAgent Only：启用创新点二（意图感知智能体），知识构建侧用 defaults
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/intent_agent_only

logging: { level: INFO, format: rich, file: null }

llm:
  provider: mock
  model: mock-llm
  temperature: 0.1
  max_tokens: 1024
  timeout: 30
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 10.0 }

embedding:
  provider: mock
  model: mock-embedding
  dim: 64
  batch_size: 32
  normalize: true

storage:
  graph:
    backend: networkx
    persist_path: ./storage/intent_agent_only/graph.gpickle
  vector:
    backend: faiss
    index_type: flat_ip
    persist_path: ./storage/intent_agent_only/vectors
    top_k: 5

datasets:
  sample:
    loader: plain_text
    path: ./examples/data/sample.txt

ingestion:
  chunker:   { active: defaults.fixed, params: { chunk_size: 300, overlap: 50 } }
  extractor: { active: defaults.simple_llm, params: { prompt_template: default, max_triples_per_chunk: 30 } }
  pruner:    { active: defaults.noop, params: {} }

query:
  intent_classifier:
    active: intent_agent.llm
    params: {}
  retriever:
    active: intent_agent.strategy_selector
    params:
      top_k: 5
      neighbor_hops: 1
  generator:
    active: defaults.prompt
    params: { prompt_template: default }

plugins:
  adagraph:
    enabled: false
  intent_agent:
    enabled: true
    memory:
      backend: in_memory
      max_history: 10
    intent_classifier:
      provider: llm
      confidence_threshold: 0.6
    strategies:
      enabled: [direct, multi_hop, comparative, iterative, expansion, context_aware]
    hooks:
      reflection:     { enabled: true, quality_threshold: 0.7, max_iterations: 3 }
      reranking:      { enabled: false, model: cross-encoder/ms-marco-MiniLM-L-6-v2, top_n: 10 }
      parallel_pool:  { enabled: false, max_workers: 4 }

web: { host: 0.0.0.0, port: 8000, cors_origins: [http://localhost:5173], static_dir: src/chimera_rag/web/static }

evaluation: { metrics: [em, f1], max_samples: 100, parallel: 1 }
