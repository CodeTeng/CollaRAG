# ============================================================================
# deepseek_vanilla.yaml
#
# 用途：DeepSeek 真实调用 + 本地 sentence-transformers embedding，
#       AdaGraph + IntentAgent 全部关闭（走 defaults.* 裸实现）。
# 典型场景：
#   - 真实端到端 baseline：衡量"裸 KG-RAG"在 DeepSeek 下的 EM/F1
#   - 作为 deepseek_intent_only / deepseek_full 的消融对照组
# 依赖：.env 中需有 LLM_API_KEY（或兼容的 DEEPSEEK_API_KEY）
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/deepseek_vanilla

logging:
  level: INFO
  format: rich
  file: null

llm:
  provider: deepseek
  # model / api_key / base_url 来自 .env（LLM_MODEL / LLM_API_KEY / LLM_BASE_URL）
  temperature: 0.1
  max_tokens: 512
  timeout: 60
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 15.0 }

embedding:
  provider: sentence_transformer
  model: ./models/sentence-transformers_all-MiniLM-L6-v2
  dim: 384
  batch_size: 32
  normalize: true
  device: cpu                   # cpu / cuda / mps / auto

storage:
  graph:
    backend: networkx
    persist_path: ./storage/deepseek_vanilla/graph.gpickle
  vector:
    backend: faiss
    index_type: hnsw            # flat_ip / flat_l2 / ivf_flat / hnsw
    metric: ip                  # ip / l2
    persist_path: ./storage/deepseek_vanilla/vectors
    top_k: 5
    hnsw:
      M: 32
      ef_construction: 200
      ef_search: 64
    ivf:
      nlist: 100
      nprobe: 8

datasets:
  mock_wiki:
    loader: mock_wiki
    corpus_path: ./data/mock_wiki/corpus.txt
    qa_path: ./data/mock_wiki/qa.jsonl
    output_dir: ./output/mock_wiki

ingestion:
  chunker:
    active: defaults.fixed
    params: { chunk_size: 300, overlap: 30 }
  extractor:
    active: defaults.simple_llm
    params: {}
  pruner:
    active: defaults.noop
    params: {}

query:
  intent_classifier:
    active: defaults.rule
    params: {}
  retriever:
    active: defaults.direct
    params: { top_k: 5, neighbor_hops: 1 }
  generator:
    active: defaults.prompt
    params: {}

plugins:
  adagraph: { enabled: false }
  intent_agent: { enabled: false }

web:
  host: 0.0.0.0
  port: 8000
  cors_origins: [http://localhost:5173]
  static_dir: src/chimera_rag/web/static

evaluation:
  metrics: [em, f1, rouge_l]
  max_samples: 100
  parallel: 1
