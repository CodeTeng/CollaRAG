# ============================================================================
# DeepSeek + sentence-transformers, AdaGraph + IntentAgent 关闭（baseline）
# 用于与 deepseek_full.yaml 对比消融实验。
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/deepseek_vanilla

logging:
  level: INFO
  format: rich
  file: null

llm:
  provider: deepseek
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  base_url_env: DEEPSEEK_BASE_URL
  temperature: 0.1
  max_tokens: 512
  timeout: 60
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 15.0 }

embedding:
  provider: sentence_transformer
  model: sentence-transformers/all-MiniLM-L6-v2
  dim: 384
  batch_size: 32
  normalize: true

storage:
  graph:
    backend: networkx
    persist_path: ./storage/deepseek_vanilla/graph.gpickle
  vector:
    backend: faiss
    index_type: flat_ip
    persist_path: ./storage/deepseek_vanilla/vectors
    top_k: 5

datasets:
  mock_wiki:
    loader: mock_wiki
    path: ./data/mock_wiki

ingestion:
  chunker:
    active: defaults.fixed
    params: { chunk_size: 300, overlap: 30 }
  extractor:
    active: defaults.simple_llm
    params: {}
  pruner:
    active: defaults.noop
    params: {}

query:
  intent_classifier:
    active: defaults.rule
    params: {}
  retriever:
    active: defaults.direct
    params: { top_k: 5, neighbor_hops: 1 }
  generator:
    active: defaults.prompt
    params: {}

plugins:
  adagraph: { enabled: false }
  intent_agent: { enabled: false }

web:
  host: 0.0.0.0
  port: 8000
  cors_origins: [http://localhost:5173]
  static_dir: src/chimera_rag/web/static

evaluation:
  metrics: [em, f1, rouge_l]
  max_samples: 100
  parallel: 1
