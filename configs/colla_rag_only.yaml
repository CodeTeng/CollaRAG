# ============================================================================
# colla_rag_only.yaml
#
# 用途：DeepSeek 真实调用 + 云端 text-embedding-3-small embedding，
#       仅启用创新点二（CollaRAG 多Agent意图感知检索架构）。
#       知识构建侧（chunker/extractor/pruner）走 defaults.*，和 vanilla 相同。
# 典型场景：
#   - 消融实验：比较 vs vanilla，单独衡量 CollaRAG 带来的增益
#   - 本轮演示主用配置
# 依赖：.env 中需有 LLM_API_KEY
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/colla_rag_only

logging:
  level: INFO
  format: rich
  file: null

llm:
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.1
  max_tokens: 2048
  timeout: 60
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 15.0 }

embedding:
  model: text-embedding-3-small
  base_url: https://api.openai.com/v1
  dim: 1536
  batch_size: 32
  normalize: true

rerank:
  enabled: false
  # 如需启用 rerank，将 enabled 改为 true 并配置 rerank 端点：
  # model: bge-reranker-v2-m3
  # base_url: http://localhost:9997/v1

storage:
  graph:
    backend: networkx
    persist_path: ./storage/colla_rag_only/graph.gpickle
  vector:
    backend: faiss
    index_type: flat_ip
    metric: ip
    persist_path: ./storage/colla_rag_only/vectors
    top_k: 5
    hnsw: { M: 32, ef_construction: 200, ef_search: 64 }
    ivf: { nlist: 100, nprobe: 8 }

datasets:
  mock_wiki:
    loader: mock_wiki
    corpus_path: ./data/mock_wiki/corpus.txt
    qa_path: ./data/mock_wiki/qa.jsonl
    output_dir: ./output/mock_wiki

# AdaGraph OFF — ingestion 走 defaults (和 vanilla 相同)
ingestion:
  chunker:
    active: defaults.fixed
    params: { chunk_size: 300, overlap: 30 }
  extractor:
    active: defaults.simple_llm
    params: {}
  pruner:
    active: defaults.noop
    params: {}

# CollaRAG ON — 多Agent架构
query:
  intent_classifier:
    active: colla_rag.tree
    params: {}
  retriever:
    active: colla_rag.multi_agent
    params: {}
  generator:
    active: defaults.prompt
    params: {}

plugins:
  adagraph:
    enabled: false
  colla_rag:
    enabled: true
    multi_agent:
      classifier:
        confidence_threshold: 0.7
        rule_fallback: true
      native_rag:
        top_k: 10
        quality_threshold: 0.4
      react:
        max_iterations: 3
        quality_threshold: 0.6
      map_reduce:
        retrieve_top_k: 50
      web_search:
        search_backend: duckduckgo
        max_results: 5

web:
  host: 0.0.0.0
  port: 8000
  cors_origins: [http://localhost:5173]
  static_dir: src/chimera_rag/web/static

evaluation:
  metrics: [em, f1, rouge_l]
  max_samples: 100
  parallel: 1
