# ============================================================================
# adagraph_only.yaml
#
# 用途：DeepSeek 真实调用 + 云端 text-embedding-3-small embedding，
#       仅启用构建侧前置基线（AdaGraph：动态分块 + 分层抽取 + 双重剪枝）。
#       注意：AdaGraph 是创新点一的落点与对照物，本身不构成宣称的创新点。
#       查询侧（intent_classifier / retriever / generator）走 defaults.*。
# 典型场景：
#   - 消融实验：比较 vs vanilla，单独衡量构建侧基线带来的增益
#   - 观察知识图谱节点/边数量 与 EM/F1 的关联性
# 依赖：.env 中需有 LLM_API_KEY
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/adagraph_only

logging:
  level: INFO
  format: rich
  file: null

llm:
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.1
  max_tokens: 512
  timeout: 60
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 15.0 }

embedding:
  model: text-embedding-3-small
  base_url: https://api.openai.com/v1
  dim: 1536
  batch_size: 32
  normalize: true

rerank:
  enabled: false

storage:
  graph:
    backend: networkx
    persist_path: ./storage/adagraph_only/graph.gpickle
  vector:
    backend: faiss
    index_type: hnsw            # flat_ip / flat_l2 / ivf_flat / hnsw
    metric: ip                  # ip / l2
    persist_path: ./storage/adagraph_only/vectors
    top_k: 5
    hnsw:
      M: 32
      ef_construction: 200
      ef_search: 64
    ivf:
      nlist: 100
      nprobe: 8

datasets:
  mock_wiki:
    loader: mock_wiki
    corpus_path: ./data/mock_wiki/corpus.txt
    qa_path: ./data/mock_wiki/qa.jsonl
    output_dir: ./output/mock_wiki

# AdaGraph ON — 只测创新点一
ingestion:
  chunker:
    active: adagraph.dynamic
    params:
      min_chunk_size: 120
      max_chunk_size: 500
      base_chunk_size: 300
  extractor:
    active: adagraph.layered
    params:
      layers_enabled: [L1]
  pruner:
    active: adagraph.dual_redundancy
    params:
      similarity_threshold: 0.85
      enable_transitive: false

# CollaRAG OFF — query 侧走 defaults (和 vanilla 相同)
query:
  intent_classifier:
    active: defaults.rule
    params: {}
  retriever:
    active: defaults.direct
    params: { top_k: 5, neighbor_hops: 1 }
  generator:
    active: defaults.prompt
    params: {}

plugins:
  adagraph:
    enabled: true
    dynamic_chunker:
      min_chunk_size: 120
      max_chunk_size: 500
      base_chunk_size: 300
      complexity_weight: 0.5
      density_weight: 0.5
    layered_extractor:
      layers_enabled: [L1]
    dual_pruner:
      similarity_threshold: 0.85
      enable_transitive: false
  colla_rag:
    enabled: false

web:
  host: 0.0.0.0
  port: 8000
  cors_origins: [http://localhost:5173]
  static_dir: src/chimera_rag/web/static

evaluation:
  metrics: [em, f1, rouge_l]
  max_samples: 100
  parallel: 1
