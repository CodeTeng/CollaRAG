# ============================================================================
# AdaGraph Only：启用创新点一（知识构建双重增强），查询侧用 defaults
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/adagraph_only

logging: { level: INFO, format: rich, file: null }

llm:
  provider: mock
  model: mock-llm
  temperature: 0.1
  max_tokens: 1024
  timeout: 30
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 10.0 }

embedding:
  provider: mock
  model: mock-embedding
  dim: 64
  batch_size: 32
  normalize: true

storage:
  graph:
    backend: networkx
    persist_path: ./storage/adagraph_only/graph.gpickle
  vector:
    backend: faiss
    index_type: flat_ip
    persist_path: ./storage/adagraph_only/vectors
    top_k: 5

datasets:
  sample:
    loader: plain_text
    path: ./examples/data/sample.txt

ingestion:
  chunker:
    active: adagraph.dynamic
    params:
      chunk_size: 300   # 作为 base_chunk_size 的 fallback
  extractor:
    active: adagraph.layered
    params:
      layers_enabled: [L1]  # MVP 只开 L1
  pruner:
    active: adagraph.dual_redundancy
    params:
      similarity_threshold: 0.85

query:
  intent_classifier: { active: defaults.rule, params: {} }
  retriever:         { active: defaults.direct, params: { top_k: 5, neighbor_hops: 1 } }
  generator:         { active: defaults.prompt, params: { prompt_template: default } }

plugins:
  adagraph:
    enabled: true
    dynamic_chunker:
      min_chunk_size: 100
      max_chunk_size: 500
      base_chunk_size: 300
      complexity_weight: 0.5
      density_weight: 0.5
    layered_extractor:
      layers_enabled: [L1]
    dual_pruner:
      similarity_threshold: 0.85
      enable_transitive: false
  intent_agent:
    enabled: false

web: { host: 0.0.0.0, port: 8000, cors_origins: [http://localhost:5173], static_dir: src/chimera_rag/web/static }

evaluation: { metrics: [em, f1], max_samples: 100, parallel: 1 }
