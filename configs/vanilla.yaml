# ============================================================================
# Vanilla KG-RAG：AdaGraph 与 IntentAgent 全部关闭，走 defaults.* 实现
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/vanilla

logging:
  level: INFO
  format: rich
  file: null

llm:
  provider: mock
  model: mock-llm
  temperature: 0.1
  max_tokens: 1024
  timeout: 30
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 10.0 }

embedding:
  provider: mock
  model: mock-embedding
  dim: 64
  batch_size: 32
  normalize: true

storage:
  graph:
    backend: networkx
    persist_path: ./storage/vanilla/graph.gpickle
  vector:
    backend: faiss
    index_type: flat_ip
    persist_path: ./storage/vanilla/vectors
    top_k: 5

datasets:
  sample:
    loader: plain_text
    path: ./examples/data/sample.txt

ingestion:
  chunker:
    active: defaults.fixed
    params: { chunk_size: 300, overlap: 50 }
  extractor:
    active: defaults.simple_llm
    params: { prompt_template: default, max_triples_per_chunk: 30 }
  pruner:
    active: defaults.noop
    params: {}

query:
  intent_classifier:
    active: defaults.rule
    params: {}
  retriever:
    active: defaults.direct
    params: { top_k: 5, neighbor_hops: 1 }
  generator:
    active: defaults.prompt
    params: { prompt_template: default }

plugins:
  adagraph:     { enabled: false }
  intent_agent: { enabled: false }

web:
  host: 0.0.0.0
  port: 8000
  cors_origins: [http://localhost:5173]
  static_dir: src/chimera_rag/web/static

evaluation:
  metrics: [em, f1]
  max_samples: 100
  parallel: 1
