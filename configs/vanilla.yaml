# ============================================================================
# vanilla.yaml
#
# 用途：DeepSeek 真实调用 + 云端 text-embedding-3-small embedding，
#       构建侧基线（AdaGraph）与 CollaRAG 全部关闭（走 defaults.* 裸实现）。
# 典型场景：
#   - 真实端到端 baseline：衡量"裸 KG-RAG"在 DeepSeek 下的 EM/F1
#   - 作为 colla_rag_only / full 的消融对照组
# 依赖：.env 中需有 LLM_API_KEY（或兼容的 DEEPSEEK_API_KEY）
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/vanilla

logging:
  level: INFO
  format: rich
  file: null

llm:
  model: deepseek-chat
  base_url: https://api.deepseek.com
  # api_key_env 默认 LLM_API_KEY，.env 中填写 DeepSeek 的 API Key
  temperature: 0.1
  max_tokens: 512
  timeout: 60
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 15.0 }

embedding:
  model: text-embedding-3-small
  base_url: https://api.openai.com/v1
  dim: 1536
  batch_size: 32
  normalize: true
  # api_key_env 默认 LLM_API_KEY；若用 OpenAI 为 embedding 单独申请 key，
  # 可设 api_key_env: EMBEDDING_API_KEY（并在 .env 中填写）
  # 若不想用 OpenAI，可改为任意兼容的 /v1/embeddings 端点，例如：
  #   base_url: http://localhost:11434/v1
  #   model: nomic-embed-text

rerank:
  enabled: false

storage:
  graph:
    backend: networkx
    persist_path: ./storage/vanilla/graph.gpickle
  vector:
    backend: faiss
    index_type: hnsw            # flat_ip / flat_l2 / ivf_flat / hnsw
    metric: ip                  # ip / l2
    persist_path: ./storage/vanilla/vectors
    top_k: 5
    hnsw:
      M: 32
      ef_construction: 200
      ef_search: 64
    ivf:
      nlist: 100
      nprobe: 8

datasets:
  mock_wiki:
    loader: mock_wiki
    corpus_path: ./data/mock_wiki/corpus.txt
    qa_path: ./data/mock_wiki/qa.jsonl
    output_dir: ./output/mock_wiki

ingestion:
  chunker:
    active: defaults.fixed
    params: { chunk_size: 300, overlap: 30 }
  extractor:
    active: defaults.simple_llm
    params: {}
  pruner:
    active: defaults.noop
    params: {}

query:
  intent_classifier:
    active: defaults.rule
    params: {}
  retriever:
    active: defaults.direct
    params: { top_k: 5, neighbor_hops: 1 }
  generator:
    active: defaults.prompt
    params: {}

plugins:
  adagraph: { enabled: false }
  colla_rag: { enabled: false }

web:
  host: 0.0.0.0
  port: 8000
  cors_origins: [http://localhost:5173]
  static_dir: src/chimera_rag/web/static

evaluation:
  metrics: [em, f1, rouge_l]
  max_samples: 100
  parallel: 1
