# ============================================================================
# Full：两个创新点全部启用，所有 Hook 打开
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/full

logging: { level: INFO, format: rich, file: null }

llm:
  provider: mock
  model: mock-llm
  temperature: 0.1
  max_tokens: 1024
  timeout: 30
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 10.0 }

embedding:
  provider: mock
  model: mock-embedding
  dim: 64
  batch_size: 32
  normalize: true

storage:
  graph:
    backend: networkx
    persist_path: ./storage/full/graph.gpickle
  vector:
    backend: faiss
    index_type: flat_ip
    persist_path: ./storage/full/vectors
    top_k: 5

datasets:
  sample:
    loader: plain_text
    path: ./examples/data/sample.txt
  hotpotqa:
    loader: hotpotqa
    path: ./data/hotpotqa/hotpot_dev_distractor_v1.json

ingestion:
  chunker:
    active: adagraph.dynamic
    params: { chunk_size: 300 }
  extractor:
    active: adagraph.layered
    params: { layers_enabled: [L1] }
  pruner:
    active: adagraph.dual_redundancy
    params: { similarity_threshold: 0.85 }

query:
  intent_classifier:
    active: intent_agent.llm
    params: {}
  retriever:
    active: intent_agent.strategy_selector
    params: { top_k: 5, neighbor_hops: 1 }
  generator:
    active: defaults.prompt
    params: { prompt_template: default }

plugins:
  adagraph:
    enabled: true
    dynamic_chunker:
      min_chunk_size: 100
      max_chunk_size: 500
      base_chunk_size: 300
      complexity_weight: 0.5
      density_weight: 0.5
    layered_extractor:
      layers_enabled: [L1]
    dual_pruner:
      similarity_threshold: 0.85
      enable_transitive: false
  intent_agent:
    enabled: true
    memory: { backend: in_memory, max_history: 10 }
    intent_classifier: { provider: llm, confidence_threshold: 0.6 }
    strategies:
      enabled: [direct, multi_hop, comparative, iterative, expansion, context_aware]
    hooks:
      reflection:     { enabled: true, quality_threshold: 0.7, max_iterations: 3 }
      reranking:      { enabled: true, model: cross-encoder/ms-marco-MiniLM-L-6-v2, top_n: 10 }
      parallel_pool:  { enabled: true, max_workers: 4 }

web: { host: 0.0.0.0, port: 8000, cors_origins: [http://localhost:5173], static_dir: src/chimera_rag/web/static }

evaluation:
  metrics: [em, f1, rouge_l]
  max_samples: 100
  parallel: 1
