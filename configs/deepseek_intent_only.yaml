# ============================================================================
# deepseek_intent_only.yaml
#
# 用途：DeepSeek 真实调用 + 本地 sentence-transformers embedding，
#       仅启用创新点二（IntentAgent：6 意图分类 → 6 策略选择 → 反思）。
#       知识构建侧（chunker/extractor/pruner）走 defaults.*，和 vanilla 相同。
# 典型场景：
#   - 消融实验：比较 vs deepseek_vanilla，单独衡量 IntentAgent 带来的增益
#   - 本轮演示主用配置
# 依赖：.env 中需有 LLM_API_KEY
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/deepseek_intent_only

logging:
  level: INFO
  format: rich
  file: null

llm:
  provider: openai
  # model / api_key / base_url 来自 .env（LLM_MODEL / LLM_API_KEY / LLM_BASE_URL）
  temperature: 0.1
  max_tokens: 2048
  timeout: 60
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 15.0 }

embedding:
  provider: sentence_transformer
  model: ./models/sentence-transformers_all-MiniLM-L6-v2
  dim: 384
  batch_size: 32
  normalize: true
  device: cpu                   # cpu / cuda / mps / auto

storage:
  graph:
    backend: networkx
    persist_path: ./storage/deepseek_intent_only/graph.gpickle
  vector:
    backend: faiss
    # 100 条规模下 flat_ip 最准（100% 召回）且速度完全够用；
    # 若语料扩到 10k+ 再切换到 hnsw。
    index_type: flat_ip         # flat_ip / flat_l2 / ivf_flat / hnsw
    metric: ip                  # ip / l2
    persist_path: ./storage/deepseek_intent_only/vectors
    top_k: 5
    hnsw:
      M: 32
      ef_construction: 200
      ef_search: 64
    ivf:
      nlist: 100
      nprobe: 8

datasets:
  mock_wiki:
    loader: mock_wiki
    corpus_path: ./data/mock_wiki/corpus.txt
    qa_path: ./data/mock_wiki/qa.jsonl
    output_dir: ./output/mock_wiki

# AdaGraph OFF — ingestion 走 defaults (和 vanilla 相同)
ingestion:
  chunker:
    active: defaults.fixed
    params: { chunk_size: 300, overlap: 30 }
  extractor:
    active: defaults.simple_llm
    params: {}
  pruner:
    active: defaults.noop
    params: {}

# IntentAgent ON — 只测创新点二
query:
  intent_classifier:
    active: intent_agent.llm
    params:
      confidence_threshold: 0.55
  retriever:
    active: intent_agent.strategy_selector
    params: { top_k: 5, neighbor_hops: 1 }
  generator:
    active: defaults.prompt
    params: {}

plugins:
  adagraph:
    enabled: false
  intent_agent:
    enabled: true
    memory:
      max_history: 10
    intent_classifier:
      confidence_threshold: 0.55
    strategies:
      enabled: [direct, multi_hop, parallel, iterative, expansion, context_aware]
    hooks:
      reflection: { enabled: false }
      reranking: { enabled: false }
      parallel_pool: { enabled: true, max_workers: 4 }

web:
  host: 0.0.0.0
  port: 8000
  cors_origins: [http://localhost:5173]
  static_dir: src/chimera_rag/web/static

evaluation:
  metrics: [em, f1, rouge_l]
  max_samples: 100
  parallel: 1
