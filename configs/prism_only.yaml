# ============================================================================
# prism_only.yaml
#
# 用途：DeepSeek 真实调用 + 云端 text-embedding-3-small embedding，
#       仅启用创新点一 PrismRAG（面向知识图谱构建的自适应分块）。
#       查询侧（intent_classifier / retriever / generator）走 defaults.*。
# 典型场景：
#   - 消融实验：比较 vs vanilla，单独衡量构建侧分块带来的增益
#   - 观察知识图谱节点/边数量 与 EM/F1 的关联性
# 依赖：.env 中需有 LLM_API_KEY
#
# 注：PrismRAG 只占用 chunker 一个插槽。extractor / pruner 保持 defaults.*，
#     使本配置相对 vanilla 的唯一变量就是分块方法。
# ============================================================================

app:
  name: chimera-rag
  version: 0.1.0
  workspace_dir: ./storage/prism_only

logging:
  level: INFO
  format: rich
  file: null

llm:
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.1
  max_tokens: 512
  timeout: 60
  retry: { max_attempts: 3, initial_wait: 1.0, max_wait: 15.0 }

embedding:
  model: text-embedding-3-small
  base_url: https://api.openai.com/v1
  dim: 1536
  batch_size: 32
  normalize: true

rerank:
  enabled: false

storage:
  graph:
    backend: networkx
    persist_path: ./storage/prism_only/graph.gpickle
  vector:
    backend: faiss
    index_type: hnsw            # flat_ip / flat_l2 / ivf_flat / hnsw
    metric: ip                  # ip / l2
    persist_path: ./storage/prism_only/vectors
    top_k: 5
    hnsw:
      M: 32
      ef_construction: 200
      ef_search: 64
    ivf:
      nlist: 100
      nprobe: 8

datasets:
  mock_wiki:
    loader: mock_wiki
    corpus_path: ./data/mock_wiki/corpus.txt
    qa_path: ./data/mock_wiki/qa.jsonl
    output_dir: ./output/mock_wiki

# PrismRAG ON — 只测创新点一
#
# 双粒度：fine 层进 extractor（保三元组纯度），coarse 层进 vector_store
# （保证据可读性），fine 通过 parent_chunk_id 绑到其 coarse 父块。
# 审计循环：抽取后按 D1–D6 检测类型化缺陷，只改分块边界（不重抽），
# 最多 audit_rounds 轮。
ingestion:
  chunker:
    active: prism.chunker
    params:
      dual_granularity: true
      fine_min_size: 120           # 抽取层：小块，压制 D1 实体碰撞 / D6 矛盾
      fine_max_size: 300
      coarse_min_size: 400         # 检索层：大块，压制 D2 指代丢失 / D4 上下文饥饿
      coarse_max_size: 800
      complexity_weight: 0.5
      density_weight: 0.5
      audit_enabled: true          # false = 消融 E2 第 4 行（双粒度但无审计）
      repair_enabled: true         # false = 消融 E2 第 5 行（记录缺陷但不修复）
      audit_rounds: 2              # k_max，上限；由 pipeline 读取而非 chunker 构造函数
      triple_budget: 30            # ⚠️ 必须等于下面 max_triples_per_chunk，否则 D5 失灵
      # dual_granularity: false 时改用这三个键（消融 E2 第 2 行：单粒度过渡版）
      # min_chunk_size: 120
      # max_chunk_size: 500
      # base_chunk_size: 300
  extractor:
    active: defaults.simple_llm
    params:
      prompt_template: default
      max_triples_per_chunk: 30    # 触顶即 D5「预算截断」信号；须与 triple_budget 一致
  pruner:
    active: defaults.noop
    params: {}

# CollaRAG OFF — query 侧走 defaults (和 vanilla 相同)
query:
  intent_classifier:
    active: defaults.rule
    params: {}
  retriever:
    active: defaults.direct
    params: { top_k: 5, neighbor_hops: 1 }
  generator:
    active: defaults.prompt
    params: {}

plugins:
  prism:
    enabled: true
    # 参考默认值；实际生效的是上面 ingestion.chunker.params。
    chunker:
      dual_granularity: true
      fine_min_size: 120
      fine_max_size: 300
      coarse_min_size: 400
      coarse_max_size: 800
      complexity_weight: 0.5
      density_weight: 0.5
      audit_enabled: true
      repair_enabled: true
      audit_rounds: 2
      triple_budget: 30
  colla_rag:
    enabled: false

web:
  host: 0.0.0.0
  port: 8000
  cors_origins: [http://localhost:5173]
  static_dir: src/chimera_rag/web/static

evaluation:
  metrics: [em, f1, rouge_l]
  max_samples: 100
  parallel: 1
