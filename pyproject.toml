[project]
name = "chimera-rag"
version = "0.1.0"
description = "Chimera-RAG: a pluggable knowledge-graph based RAG framework with AdaGraph and IntentAgent innovations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Teng Li" }]
keywords = ["rag", "knowledge-graph", "agent", "retrieval-augmented-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

# 主依赖（最小集，后续 uv add 再追加）
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "tenacity>=8.2",
    "rich>=13.7",
]

[project.optional-dependencies]
# Web 系统
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
]
# 向量 / embedding
vec = [
    "faiss-cpu>=1.7.4",
]
# OpenAI / DeepSeek / Ollama
llm = [
    "openai>=1.14",
    "httpx>=0.27",
]
# 评测
eval = [
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
]
# 本地 sentence-transformers embedding
st = [
    "sentence-transformers>=2.5",
]
# Neo4j 图后端
neo4j = [
    "neo4j>=5.18",
]
# NLP 辅助
spacy = [
    "spacy>=3.7",
]

[project.scripts]
chimera = "chimera_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera_rag"]

# ---------- uv ----------
# 使用现代 PEP 735 dependency-groups 语法
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.3",
]

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring real LLM/Embedding API",
]
filterwarnings = [
    # faiss-cpu uses SWIG which triggers deprecation warnings on Python 3.11+.
    "ignore::DeprecationWarning:importlib._bootstrap",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # Field(default_factory=...) is idiomatic Pydantic
    "B024",  # ABCs with only abstract methods may have no abstractmethod attr
    "B904",  # raise ... from err is best-effort in helpers
    "B905",  # zip(strict=...) flagged but we want 3.9 compat semantics
    "E741",  # single-letter ambiguous names acceptable in local scope
    "SIM102", "SIM117",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "E402", "RUF043"]

# ---------- black ----------
[tool.black]
line-length = 100
target-version = ["py311"]
