[project]
name = "chimera-rag"
version = "0.1.0"
description = "Chimera-RAG: a pluggable knowledge-graph based RAG framework with AdaGraph and IntentAgent innovations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Teng Li" }]
keywords = ["rag", "knowledge-graph", "agent", "retrieval-augmented-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

# 主依赖（最小集，后续 uv add 再追加）
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "numpy>=1.26,<2",
    "tenacity>=8.2",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Web 系统
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# 向量 / embedding
vec = [
    "faiss-cpu>=1.7.4",
]
# OpenAI / DeepSeek / Ollama
llm = [
    "openai>=1.14",
    "httpx>=0.27",
]
# RAGAS 语义级评测（Faithfulness / Answer Relevancy / Context Precision / Context Recall）
ragas = [
    "ragas>=0.3,<0.4",
    "langchain-openai>=0.3",
    "langchain-huggingface>=0.3",
    "datasets>=2.16",
]
# LangChain 长度分块器（defaults.langchain）
chunk = [
    "langchain-text-splitters>=0.3",
]
# 创新点 2：CollaRAG 多Agent架构（langchain-core 工具接口 + BM25）
agent = [
    "langchain-core>=1.0,<2",
    "rank-bm25>=0.2.2",
]

[project.scripts]
chimera = "chimera_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera_rag"]

# ---------- uv ----------
# agent extra 需要 langchain-core>=1.0，ragas 经 langchain-community 可能锁死
# langchain-core<1.0，两者无法在同一解析空间共存。声明为互斥 extra。
[tool.uv]
conflicts = [
    [
        { extra = "agent" },
        { extra = "ragas" },
    ],
]

# 使用现代 PEP 735 dependency-groups 语法
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "matplotlib>=3.10.9",
]

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers -m \"not integration\""
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring real LLM/Embedding API",
]
filterwarnings = [
    # faiss-cpu uses SWIG which triggers deprecation warnings on Python 3.11+.
    "ignore::DeprecationWarning:importlib._bootstrap",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # Field(default_factory=...) is idiomatic Pydantic
    "B024",  # ABCs with only abstract methods may have no abstractmethod attr
    "B904",  # raise ... from err is best-effort in helpers
    "B905",  # zip(strict=...) flagged but we want 3.9 compat semantics
    "E741",  # single-letter ambiguous names acceptable in local scope
    "SIM102", "SIM117",
    "UP007",
    "RUF001", "RUF002", "RUF003",  # 允许中文全角标点（注释/docstring/字符串）
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "E402", "RUF043"]

