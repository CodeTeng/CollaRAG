[project]
name = "chimera-rag"
version = "0.1.0"
description = "Chimera-RAG: a pluggable knowledge-graph based RAG framework with AdaGraph and IntentAgent innovations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Teng Li" }]
keywords = ["rag", "knowledge-graph", "agent", "retrieval-augmented-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

# 主依赖（最小集，后续 uv add 再追加）
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "numpy>=1.26,<2",
    "tenacity>=8.2",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Web 系统
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
]
# 向量 / embedding
vec = [
    "faiss-cpu>=1.7.4",
]
# OpenAI / DeepSeek / Ollama
llm = [
    "openai>=1.14",
    "httpx>=0.27",
]
# 评测
eval = [
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
]
# RAGAS 语义级评测（Faithfulness / Answer Relevancy / Context Precision / Context Recall）
# 用 >=0.3：0.2.x 经 langchain-community 强制 langchain-core<0.4，与 agent extra
# 的 langchain-core>=1.0 冲突；0.3 起兼容 langchain-core 1.x，可与 LangGraph 共存。
ragas = [
    "ragas>=0.3,<0.4",
    "langchain-openai>=0.3",
    "langchain-huggingface>=0.3",
    "datasets>=2.16",
    # ragas 0.3 的 multi_modal_prompt 会 import PIL，但未将其声明为强制依赖。
    "pillow>=10.0",
]
# LangChain 长度分块器（defaults.langchain）
chunk = [
    "langchain-text-splitters>=0.3",
]
# 本地 sentence-transformers embedding
# torch pinned to <2.3 to stay compatible with macOS x86_64 (Intel Mac) wheels.
st = [
    "sentence-transformers>=2.5,<3.0",
    "torch>=2.0,<2.3",
]
# Neo4j 图后端
neo4j = [
    "neo4j>=5.18",
]
# NLP 辅助
spacy = [
    "spacy>=3.7",
]
# 创新点 2b：LangGraph Agentic 检索（动态工具编排）
# 使用 LangGraph / LangChain 1.x GA（LTS）稳定版：核心 StateGraph API 稳定，
# 不依赖已废弃的 langgraph.prebuilt.create_react_agent（我们用底层 StateGraph 自编排）。
agent = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
]

[project.scripts]
chimera = "chimera_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera_rag"]

# ---------- uv ----------
# RAGAS（经 langchain-community）锁死 langchain-core<1.0，而 agent extra（LangGraph）
# 需要 langchain-core>=1.0，两者无法在同一解析空间共存。声明为互斥 extra，使
# `uv sync --extra ragas` 与 `uv sync --extra agent` 各自独立解析、互不牵连。
[tool.uv]
conflicts = [
    [
        { extra = "agent" },
        { extra = "ragas" },
    ],
]

# 使用现代 PEP 735 dependency-groups 语法
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.3",
]

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring real LLM/Embedding API",
]
filterwarnings = [
    # faiss-cpu uses SWIG which triggers deprecation warnings on Python 3.11+.
    "ignore::DeprecationWarning:importlib._bootstrap",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # Field(default_factory=...) is idiomatic Pydantic
    "B024",  # ABCs with only abstract methods may have no abstractmethod attr
    "B904",  # raise ... from err is best-effort in helpers
    "B905",  # zip(strict=...) flagged but we want 3.9 compat semantics
    "E741",  # single-letter ambiguous names acceptable in local scope
    "SIM102", "SIM117",
    "UP007",
    "RUF001", "RUF002", "RUF003",  # 允许中文全角标点（注释/docstring/字符串）
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "E402", "RUF043"]

# ---------- black ----------
[tool.black]
line-length = 100
target-version = ["py311"]
